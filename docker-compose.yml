name: eduvault

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: eduvault
      POSTGRES_PASSWORD: eduvault
      POSTGRES_DB: eduvault
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eduvault -d eduvault']
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    profiles: [s3]
    image: cgr.dev/chainguard/minio@sha256:dc455cdd4db6e390b1b26514f15ff37681a777bf8dab41aac445a0259f751e56
    command: ['server', '--console-address', ':9001', '/data']
    environment:
      MINIO_ROOT_USER: eduvault
      MINIO_ROOT_PASSWORD: eduvault-secret
    ports:
      - '9100:9000'
      - '9101:9001'
    volumes:
      - miniodata:/data

  minio-init:
    profiles: [s3]
    image: cgr.dev/chainguard/minio-client@sha256:799f7e86017c3ee8d00f6372e1ee28dd73453f271d5b306a47af8e8a408a777a
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://eduvault:eduvault-secret@minio:9000
    entrypoint:
      - /bin/sh
      - -c
      - until mc ready local; do sleep 1; done && mc mb --ignore-existing local/eduvault && mc version enable local/eduvault

volumes:
  pgdata:
  miniodata:
