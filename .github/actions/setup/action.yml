name: Set up Eduvault
description: pnpm, Node, dependencies, the Nx base commit and the Nx task cache

inputs:
  cache-scope:
    description: Names the Nx cache so jobs that run different tasks do not overwrite each other
    required: true

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - uses: nrwl/nx-set-shas@v5
    - uses: actions/cache@v5
      with:
        path: .nx/cache
        key: nx-${{ inputs.cache-scope }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          nx-${{ inputs.cache-scope }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
          nx-${{ inputs.cache-scope }}-${{ runner.os }}-
