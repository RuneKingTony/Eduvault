name: Set up Eduvault
description: pnpm, Node, dependencies and, for jobs that run nx affected, the Nx base commit

inputs:
  nx:
    description: Set the Nx base commit; false for jobs that run no affected command
    default: 'true'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - if: inputs.nx == 'true'
      uses: nrwl/nx-set-shas@v5
