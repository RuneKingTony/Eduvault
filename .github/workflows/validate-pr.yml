name: Validate PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NX_PARALLEL: 4
  INTEGRATION_SHARDS: 4

jobs:
  # `quick` and `unit` run side by side and are all a draft gets. The expensive
  # jobs wait for `quick` and start only once the PR is marked ready.
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      api: ${{ steps.scope.outputs.api }}
      drift: ${{ steps.scope.outputs.drift }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm knip
      - run: pnpm nx affected -t typecheck lint --parallel="$NX_PARALLEL" --nxBail
      - id: scope
        run: |
          affected=$(pnpm --silent nx show projects --affected --json)
          echo "api=$(jq 'index("api") != null' <<<"$affected")" >> "$GITHUB_OUTPUT"
          if git diff --name-only "$NX_BASE" "$NX_HEAD" | grep -qE '^(apps/api/db/|apps/api/src/db/|apps/api/auth\.ts|apps/api/src/app/common/auth/|scripts/(drift-check|auth-sql|paths)\.ts|libs/testcontainers/|pnpm-lock\.yaml)'; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm nx affected -t test build --parallel="$NX_PARALLEL" --nxBail

  integration:
    needs: quick
    if: needs.quick.outputs.api == 'true' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          nx: false
      - run: pnpm nx run api:test-integration -- --shard="${{ matrix.shard }}/$INTEGRATION_SHARDS"

  drift:
    needs: quick
    if: needs.quick.outputs.drift == 'true' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          nx: false
      - run: pnpm drift

  # The one required check: it names the jobs above so branch rules need only this.
  validate:
    if: always()
    needs: [quick, unit, integration, drift]
    runs-on: ubuntu-latest
    steps:
      - if: github.event.pull_request.draft
        run: echo "::notice::Draft PR, so integration and drift were not run. They start when it is marked ready for review."
      - run: |
          echo '${{ toJSON(needs) }}'
          if [[ '${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}' == 'true' ]]; then
            exit 1
          fi
